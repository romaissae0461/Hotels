    <body> 
<mat-sidenav-container fullscreen>
     <mat-sidenav mode="side" #sidenav opened position="start" style=" width: 23%"> <!--background-color: peru; -->
      <!-- <button mat-icon-button (click)="toggleSidenav(sidenav)">
        <mat-icon><img src="../assets/luna/menu1.png" alt=""></mat-icon>
      </button> -->
        <mat-nav-list>
          <a><img src="https://see.fontimg.com/api/renderfont4/8M22Z/eyJyIjoiZnMiLCJoIjo2NSwidyI6MTAwMCwiZnMiOjY1LCJmZ2MiOiIjMDAwMDAwIiwiYmdjIjoiI0ZGRkZGRiIsInQiOjF9/SG90ZWwgRGVsIEx1bmE/legendary-runes-free-trial.png" ></a>
          <br><br>
            <a mat-list-item href="/manager">Dashboard</a>
            <a mat-list-item href="/reservations">Reservations</a>
            <a mat-list-item href="/chambres">Chambres</a>
            <a mat-button [matMenuTriggerFor]="reservations">Reservations</a>
            <mat-menu #reservations="matMenu">
              <a mat-menu-item href="/reservations">All Reservations</a>
              <a mat-menu-item href="/create-r">Add</a>
            </mat-menu>

            <a mat-list-item href="">Rapports</a>
            <a mat-list-item href="/clients">Clients</a>
            <a mat-list-item href="">Paiement</a>
            <a mat-list-item href="">Commentaires</a>
            <a mat-list-item href="">Paramètres</a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>  
  <div class="row" style="padding-left: 20px;">
    <div class="medium-offset-4 medium-11 columns">
        <h1>Formulaire de Reservation</h1>
        <div class="d-flex align-item-center justify-content-center ">
            <div *ngIf="successMessage" class="alert alert-success">
                <h3>{{ successMessage }}</h3>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger">
                <ul>
                    <li>{{ errorMessage }}</li>
                </ul>
            </div>
            <form method="post" action="/clients">
                <input type="hidden" name="_method" value="put">
                <hr> 
                <div class="d-flex align-content-between justify-content-center">
                    
                    <input name="nom" type="text" [(ngModel)]="nom" placeholder="Nom">
                
                    
                    <input name="prenom" type="text" [(ngModel)]="prenom" placeholder="Prénom">
                </div>
<br>
                <div class="">
                    
                    <input name="email" type="text" [(ngModel)]="email" placeholder="Email">
                    <input name="mobile" type="text" placeholder="Mobile">
                </div>
<br>
                
<br>
                <div class="d-flex align-item-center justify-content-center ">
                    <div>
                    <input name="dateArrivee" type="date" [(ngModel)]="dateArrivee" placeholder="Date d'arrivée">
                    </div>
                    <div>
                    <input name="dateDepart" type="date" [(ngModel)]="dateDepart" placeholder="Date de départ">
                    </div>
                </div>
<br>
                <div class="d-flex align-item-centre justify-content-between">
                    <label class="label info">Nombre de chambre: </label> <br>
                    <input name="nbrChambre" type="text" [(ngModel)]="nbrChambre">
                
                    <label class="label info">Nombre de personne: </label><br>
                    <input name="nbrPersonne" type="text" [(ngModel)]="nbrPersonne">
                </div>
<br>
                <div class="medium-4 columns">
                    <label class="label info">Numero de la chambre: </label><br>
                    <select class="form-control" name="numC" [(ngModel)]="numC">
                        <option value="">selectionnez une chambre</option>
                        <option *ngFor="let chambre of chambres" value="{{chambre.id}}">{{chambre.numC}}</option>
                    </select>
                </div>
                
                <input type="text" name="id" [(ngModel)]="id">
                <input type="text" name="idC" [(ngModel)]="idC">
                
                
    <button type="submit" class="btn btn-primary" (click)="store()">Enregistrer</button>
    <a href="/home" class="btn btn-danger">Annuler</a>
            </form>
        </div>
    </div>
</div>
 </mat-sidenav-content>
    </mat-sidenav-container>

    
  </body>
