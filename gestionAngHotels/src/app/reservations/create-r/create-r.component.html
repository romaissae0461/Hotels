   top: 5px;

    <body> 
<mat-sidenav-container fullscreen>
     <mat-sidenav mode="side" #sidenav opened position="start" style=" width: 23%"> <!--background-color: peru; -->
      <!-- <button mat-icon-button (click)="toggleSidenav(sidenav)">
        <mat-icon><img src="../assets/luna/menu1.png" alt=""></mat-icon>
      </button> -->
        <mat-nav-list>
          <a><img src="https://see.fontimg.com/api/renderfont4/8M22Z/eyJyIjoiZnMiLCJoIjo2NSwidyI6MTAwMCwiZnMiOjY1LCJmZ2MiOiIjMDAwMDAwIiwiYmdjIjoiI0ZGRkZGRiIsInQiOjF9/SG90ZWwgRGVsIEx1bmE/legendary-runes-free-trial.png" ></a>
          <br><br>
            <a mat-list-item href="/manager">Dashboard</a>
            <a mat-list-item href="/reservations">Reservations</a>
            <a mat-list-item href="/chambres">Chambres</a>
            <a mat-button [matMenuTriggerFor]="reservations">Reservations</a>
            <mat-menu #reservations="matMenu">
              <a mat-menu-item href="/reservations">All Reservations</a>
              <a mat-menu-item href="/create-r">Add</a>
            </mat-menu>

            <a mat-list-item href="">Rapports</a>
            <a mat-list-item href="/clients">Clients</a>
            <a mat-list-item href="">Paiement</a>
            <a mat-list-item href="">Commentaires</a>
            <a mat-list-item href="">Paramètres</a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>  
        <mat-grid-list cols="1" class="d-flex align-content-between justify-content-between">
            <mat-grid-tile [colspan]="1" [rowspan]="1">
              <mat-card class="dashboard-card" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;">
                <mat-card-header>
                  <mat-card-title>
                    Formulaire de réservations
                  </mat-card-title>
                </mat-card-header>
                <mat-card-content >
                    <div class="d-flex align-content-between justify-content-center inp">
                    
                        <input name="nom" type="text" [(ngModel)]="nom" placeholder="Nom" style="margin-right: 50px; padding-right: 200px; height: 50px; border-radius: 8px;">
                    
                        
                        <input name="prenom" type="text" [(ngModel)]="prenom" placeholder="Prénom" style="padding-right: 200px; height: 50px; border-radius: 8px;">
                    </div>
    <br>
                    <div class="d-flex align-content-center justify-content-center inp">
                        
                        <input name="email" type="text" [(ngModel)]="email" placeholder="Email" style="margin-right: 50px; padding-right: 200px; height: 50px; border-radius: 8px;">
                        <input name="mobile" type="text" placeholder="Mobile" style="padding-right: 200px; height: 50px; border-radius: 8px;">
                    </div>
    <br>
                    
                    <div class="d-flex align-content-center justify-content-center inp">
                        <div>
                            <label class="label info">Date d'arrivée: </label> <br>
                            <input name="dateArrivee" type="date" [(ngModel)]="dateArrivee" placeholder="Date d'arrivée" style="margin-right: 50px; padding-right: 265px; height: 50px; border-radius: 8px;">
                        </div>
                        <div>
                            <label class="label info">Date de départ: </label> <br>
                            <input name="dateDepart" type="date" [(ngModel)]="dateDepart" placeholder="Date de départ" style="padding-right: 260px; height: 50px; border-radius: 8px;">
                        </div>
                    </div>
    <br><br>
                    <div class="d-flex align-content-centre justify-content-center inp">
                        <div>
                            <label class="label info">Nombre de chambre: </label> <br>
                            <input name="nbrChambre" type="text" [(ngModel)]="nbrChambre" style="margin-right: 50px; padding-right: 205px; height: 50px; border-radius: 8px;">
                        </div>
                        <div>
                            <label class="label info">Nombre de personne: </label><br>
                            <input name="nbrPersonne" type="text" [(ngModel)]="nbrPersonne" style="padding-right: 205px; height: 50px; border-radius: 8px;">
                        </div>
                    </div>
    <br>
                    <div class="" style="margin-left: 60px; width: 100px; height: 100px; padding-top: 20px;margin-right: 50px; height: 50px; border-radius: 8px;">
                        <label class="label info">Numero de la chambre: </label><br>
                        <select class="form-control" name="numC" [(ngModel)]="id">
                            <option value="">selectionnez une chambre</option>
                            <option *ngFor="let chambre of chambres" value="{{chambre.id}}">{{chambre.numC}}</option>
                        </select>
                    </div>
                    <br> <br>
                    <div>
                    <button type="submit" class="btn btn-primary" (click)="store()">Enregistrer</button>
                    <a href="/create-r" class="btn btn-danger">Annuler</a>  
                    </div>
                </mat-card-content>
              </mat-card>
            </mat-grid-tile>
        </mat-grid-list>
  
 </mat-sidenav-content>
    </mat-sidenav-container>

    
  </body>
  </html>
