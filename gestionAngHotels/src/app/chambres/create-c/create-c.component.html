<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajout d'un Client</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@angular/material@12.0.0/prebuilt-themes/indigo-pink.css">
    <style>
        .more-button {
   position: absolute;
   top: 5px;
   right: 10px;
}

.dashboard-card {
   position: absolute;
   top: 15px;
   left: 15px;
   right: 15px;
   bottom: 15px;
}


.dashboard-card-content {
   text-align: center;
   flex-grow: 1;
   display: flex;
   flex-direction: column;
   align-items: center;
   max-height: 100%;
   justify-content: center;
   align-items: stretch;
}

mat-card {
   display: flex;
   flex-direction: column;
}

.inp{
    margin-left: 450px;
    width: 100px;
    height: 50px;
    padding-top: 90px;
}
    </style>
</head>
<body>
    <div class="mt-4">
        <div *ngIf="successMessage" class="alert alert-success">
            <h3>{{ successMessage }}</h3>
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger">
            <ul>
                <li>{{ errorMessage }}</li>
            </ul>
        </div>
    </div>
<mat-sidenav-container fullscreen>
    <mat-sidenav mode="side" #sidenav opened position="start" style="width: 23%">
        <mat-nav-list>
            <a><img src="https://see.fontimg.com/api/renderfont4/8M22Z/eyJyIjoiZnMiLCJoIjo2NSwidyI6MTAwMCwiZnMiOjY1LCJmZ2MiOiIjMDAwMDAwIiwiYmdjIjoiI0ZGRkZGRiIsInQiOjF9/SG90ZWwgRGVsIEx1bmE/legendary-runes-free-trial.png"></a>
            <br><br>
            <a mat-list-item href="/manager">Dashboard</a>
            <div style="margin-left: 8px;  font-size: x-large;">
            <a mat-button [matMenuTriggerFor]="chambres">Chambres</a>
            <mat-menu #chambres="matMenu" style="padding-bottom: 10px;">
              <a mat-list-item href="/chambres">Liste Chambres</a>
              <a mat-list-item href="/create-c">Ajouter Chambre</a>
            </mat-menu><br>
            <a mat-button [matMenuTriggerFor]="reservations">Reservations</a>
            <mat-menu #reservations="matMenu" style="padding-bottom: 10px;">
              <a mat-menu-item href="/reservations">Liste Reservations</a>
              <a mat-menu-item href="/create-r">Ajouter Reservation</a>
            </mat-menu>
<br>
            <a mat-button [matMenuTriggerFor]="clients">Clients</a>
            <mat-menu #clients="matMenu">
              <a mat-menu-item href="/clients">Liste CLients</a>
              <a mat-menu-item href="/create">Ajouter Client</a>
            </mat-menu></div>
            <a mat-list-item href="/confirm">Paiement</a>
            <a mat-list-item href="/comment">Commentaires</a>
            <a mat-list-item href="/">Site</a>
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content style="background-color: burlywood;padding-top: 30px; padding-bottom: 12px; margin-left: 23%;">  
        <mat-grid-list cols="1" rowHeight="615px" class="d-flex align-content-between justify-content-between">
            <mat-grid-tile [colspan]="1" [rowspan]="1">
              <mat-card class="dashboard-card" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px; height: 588px;">
                <mat-card-header>
                  <mat-card-title style="font-size: 40px; font-family: system-ui; padding-top: 20px; padding-bottom: 0px;">
                    Ajout d'une nouvelle chambre
                  </mat-card-title>
                    </mat-card-header>
                    <mat-card-content>
                        
            <div class="d-flex align-content-between justify-content-center inp">
                <div>
                    <input name="numC" type="text" [(ngModel)]="numC" placeholder="Numéro" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;margin-right: 30px; padding-right: 250px; height: 70px; border:1px solid gray; border-radius: 8px;">
                </div>
                <div>
                    <input name="nbrLits" type="text" [(ngModel)]="nbrLits" placeholder="Nombre de Lits" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;margin-right: 30px; padding-right: 250px; height: 70px; border:1px solid gray; border-radius: 8px;">
                </div>
            </div>
            <div class="d-flex align-content-between justify-content-center inp">
                <div>
                    <input name="prixC" type="text" [(ngModel)]="prixC" placeholder="Prix" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;margin-right: 30px; padding-right: 250px; height: 70px; border:1px solid gray; border-radius: 8px;">
                </div>
                <div>
                    <input name="etage" type="text" [(ngModel)]="etage" placeholder="Etage" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;margin-right: 30px; padding-right: 250px; height: 70px; border:1px solid gray; border-radius: 8px;">
                </div>
            </div>
            <div class="" style="margin-left: 16px; padding-top: 90px;">
                <label>Type de chambre</label><br>
                    <select class="form-control" [(ngModel)]="type_chambre_id" name="type_chambre_id" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;width: 100px; height: 50px; padding-top: 50px; padding-right: 940px; border:1px solid gray; border-radius: 8px;">
                        <option value="">Selectionne un type</option>
                        <option *ngFor="let type of typeChambre" [value]="type.id">{{ type.typeC }}</option>                    
                    </select>
            </div>
                

            <div class="d-flex align-content-between justify-content-center inp" style="padding-top: 0px; padding-left: 10px;">
                <div>
                    <label>Status</label><br>
                    <input name="status" type="text" [(ngModel)]="status" placeholder="Status" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;margin-right: 30px; padding-right: 250px; height: 70px; border:1px solid gray; border-radius: 8px;">
                </div>
                <div>
                    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
                    <label>Image de la chambre</label><br>
                    <input name="image" type="file" [(ngModel)]="selectedImage" placeholder="Image de la chambre" (change)="onFileChange($event)" style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); border-radius: 8px;margin-right: 30px; padding-right: 135px; height: 70px; border:1px solid gray; border-radius: 8px;">
                </div>
            </div>
                
                <br> <br>
                <div class="d-flex align-content-center justify-content-start" style=" margin-left: 40px; padding-top: 15px;">
                <button type="submit" class="btn btn-primary" style="background-color: peru;" (click)="create()">Enregistrer</button>
                <a href="/chambres" class="btn btn-danger" style="background-color: rgb(240, 225, 210); margin-left: 20px;">Annuler</a>  
                </div> 
                    
                
                </mat-card-content>
            </mat-card>
        </mat-grid-tile>
    </mat-grid-list>
</mat-sidenav-content>
</mat-sidenav-container>
</body>
</html>
