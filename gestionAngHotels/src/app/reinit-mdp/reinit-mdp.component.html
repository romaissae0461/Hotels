   <!-- reinit-mdp.component.html -->
<div class="bg-img">
  <form class="container" (submit)="resetPassword()">
      <div class="d-flex align-content-center justify-content-center">
          <img src="../assets/luna/del_luna_logo.jpeg" style="width: 20%;">
          <h1>Réinitialisation du mot de passe</h1>
      </div>

      <label for="email"><b>Email</b></label>
      <input type="email" placeholder="Enter Email" name="email" [(ngModel)]="email" >

      <label for="password"><b>New Password</b></label>
      <input type="password" placeholder="Enter New Password" name="password" [(ngModel)]="password" required>

      <label for="password_confirmation"><b>Confirm Password</b></label>
      <input type="password" placeholder="Confirm New Password" name="password_confirmation" [(ngModel)]="password_confirmation" required>

      <button type="submit" class="btn" (click)="resetPassword()">Reset Password</button><br><br>
  </form>
</div>
