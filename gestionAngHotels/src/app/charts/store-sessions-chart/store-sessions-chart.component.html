<mat-card>
  <mat-card-header>
    <mat-card-title>Sessions en Magasin</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-container">
      <canvas baseChart
        [datasets]="pieChartData"
        [labels]="pieChartLabels"
        [options]="pieChartOptions"
        [type]="pieChartType">
      </canvas>
    </div>
  </mat-card-content>
</mat-card>
