<mat-card>
  <mat-card-header>
    <mat-card-title>Ventes Annuelles</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-container">
    <canvas baseChart
      [datasets]="barChartData"
      [labels]="barChartLabels"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>
  </mat-card-content>
</mat-card>
