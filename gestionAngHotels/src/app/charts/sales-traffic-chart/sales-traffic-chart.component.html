<mat-card>
  <mat-card-header>
    <mat-card-title>Trafic des Ventes</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-container">
      <canvas baseChart
        [datasets]="lineChartData"
        [labels]="lineChartLabels"
        [options]="lineChartOptions"
        [type]="lineChartType">
      </canvas>
    </div>
  </mat-card-content>
</mat-card>
