<mat-card>
  <mat-card-header>
    <mat-card-title>Ventes de Produits</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-container">
      <canvas baseChart
        [datasets]="radarChartData"
        [labels]="radarChartLabels"
        [options]="radarChartOptions"
        [type]="radarChartType">
      </canvas>
    </div>
  </mat-card-content>
</mat-card>
