<mat-card style="box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);">
  <mat-card-header>
    <mat-card-title>Ventes de Produits</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="chart-container">
      <canvas baseChart
        [datasets]="radarChartData"
        [labels]="radarChartLabels"
        [options]="radarChartOptions"
        [type]="radarChartType">
      </canvas>
    </div>
  </mat-card-content>
</mat-card>
